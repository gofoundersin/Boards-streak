<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Streak</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f7;--card:#fff;--tx:#14213d;--mut:#5d6b85;--bd:#d6deea;--ac:#e07a00;--ok:#1f9d55;--no:#d93636;--soft:#e3e9f2;--bar:#14213d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--tx:#eaf0ff;--mut:#93a1c2;--bd:#26324f;--ac:#ffb020;--ok:#3ddc84;--no:#ff6b6b;--soft:#1f2a46;--bar:#ffb020}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--tx:#eaf0ff;--mut:#93a1c2;--bd:#26324f;--ac:#ffb020;--ok:#3ddc84;--no:#ff6b6b;--soft:#1f2a46;--bar:#ffb020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.btn{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;display:inline-flex;gap:6px;align-items:center;flex:none}
.btn:focus-visible,.box:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
h1{font:700 24px/1.1 Georgia,serif;margin:0}
.date{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:700 24px Georgia,serif}.stat span{font-size:12px;color:var(--mut)}
.banner{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}
.task.miss{border-color:var(--no)}.task.done{border-color:var(--ok)}
.box{width:42px;height:42px;flex:none;border-radius:10px;border:2.5px solid var(--tx);background:transparent;font-size:22px;line-height:1;color:var(--tx);cursor:pointer}
.box:disabled{cursor:not-allowed;opacity:.5}
.done .box{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.miss .box{border-color:var(--no);opacity:1}
.time{font-size:13px;font-weight:700;color:var(--ac)}
.t{flex:1;min-width:0;font-weight:600}.done .t{text-decoration:line-through;color:var(--mut)}
.s{font-size:13px;color:var(--mut);font-weight:400}.miss .s{color:var(--no);font-weight:700}.done .s{color:var(--ok);font-weight:700}
h2{font:700 18px Georgia,serif;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.big{font:700 56px/1 Georgia,serif}
.bar{height:16px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--bar);border-radius:99px;transition:width .5s}
.map{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{font-size:11px;text-align:center;color:var(--mut)}
.d{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--mut)}
.d.ok{background:var(--ok);color:#fff}.d.x{background:var(--no);color:#fff}.d.part{background:transparent;border:2px dashed var(--ac);color:var(--tx)}
.d.today{outline:3px solid var(--tx);outline-offset:1px}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bd{border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--card)}
.bd.lock{opacity:.45;filter:grayscale(1)}.bd b{display:block}.bd span{font-size:12px;color:var(--mut)}
.note{font-size:13px;color:var(--mut)}
summary{cursor:pointer;font-weight:700}
.chart{max-height:360px;overflow:auto;margin-top:8px}
.chart div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}
.chart b{flex:none;width:76px}
.q{font:600 17px/1.4 Georgia,serif;margin:6px 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--soft)}
.row{display:flex;gap:8px;margin:10px 0}
.pal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.pn{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.pn.a{background:var(--soft);font-weight:700}.pn.c{outline:3px solid var(--ac)}
.trow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opt.ok{border-color:var(--ok);background:rgba(31,157,85,.16)}.opt.bad{border-color:var(--no);background:rgba(217,54,54,.14)}.opt:disabled{cursor:default;color:var(--tx)}
.vwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:8px}
.vwrap.small{width:50%;margin-left:auto}.vwrap iframe{width:100%;height:100%;border:0}
.task.weak{border-color:#f4c20d}.weak .box{background:#f4c20d;border-color:#f4c20d;color:#14213d}
.d.y{background:#f4c20d;color:#14213d}
</style>
</head>
<body>
<main id="app"></main>
<script src="tests.js"></script>
<script src="lessons.js"></script>
<script src="dailytests.js"></script>
<script src="qa-maths.js"></script>
<script src="qa-science.js"></script>
<script src="qa-social.js"></script>
<script src="qa-english.js"></script>
<script src="qa-hindi.js"></script>
<script src="qa-it.js"></script>
<script>
const KEY='boardstreak_v2',GOAL=300,N=81,ST=new Date(2026,10,1);
const P=['T:Diagnostic basics: arithmetic, science concepts, reading','Maths: Real Numbers','Science: Chemical Reactions and Equations','SST: History: Rise of Nationalism in Europe','Maths: Polynomials','English: A Letter to God','Science: Acids, Bases and Salts','T:Science',
'Hindi: Kshitij: Surdas - Pad','Maths: Pair of Linear Equations','IT: Employability: Communication Skills-II','SST: History: Nationalism in India','Science: Metals and Non-metals','Maths: Quadratic Equations','T:SST',
'English: Nelson Mandela: Long Walk to Freedom','Hindi: Kshitij: Tulsidas - Ram Lakshman Parshuram Samvad','IT: Employability: Self-Management Skills-II','SST: History: Making of a Global World (prescribed sections)','Maths: Arithmetic Progressions','Science: Carbon and its Compounds','T:English',
'SST: History: Print Culture and the Modern World','Maths: Triangles','English: Two Stories about Flying','Science: Life Processes','Hindi: Kshitij: Jayashankar Prasad - Atmakathya','Maths: Coordinate Geometry','T:Hindi',
'IT: Employability: ICT Skills-II','SST: Geography: Resources and Development','Science: Control and Coordination','Maths: Introduction to Trigonometry','English: From the Diary of Anne Frank','Hindi: Kshitij: Nirala - Utsah / At Nahi Rahi Hai','T:IT',
'IT: Employability: Entrepreneurial Skills-II','SST: Geography: Forest and Wildlife Resources','Maths: Applications of Trigonometry','Science: How Do Organisms Reproduce?','SST: Geography: Water Resources','Maths: Circles','T:Maths',
'English: Glimpses of India','Science: Heredity','Hindi: Kshitij: Nagarjun - Yah Danturit Muskan / Fasal','Maths: Areas Related to Circles','IT: Employability: Green Skills-II','SST: Geography: Manufacturing Industries','T:Science',
'Science: Electricity','Maths: Probability','English: The Sermon at Benares','Hindi: Kshitij: Balgobin Bhagat','IT: Electronic Spreadsheet (Advanced): Scenarios / Goal Seek','SST: Geography: Lifelines of National Economy (map work)','T:SST',
'Maths: Real Numbers (revision)','Science: Magnetic Effects of Electric Current','SST: Civics: Power Sharing','Maths: Polynomials (revision)','English: Poems: The Ball Poem / Amanda!','Science: Metals and Non-metals (revision)','T:English',
'Hindi: Kshitij: Sanskriti','Maths: Triangles (revision)','IT: Healthy, Safe and Secure Working Environment','SST: Civics: Outcomes of Democracy','Science: Carbon and its Compounds (revision)','Maths: Coordinate Geometry (revision)','T:Hindi',
'English: Poems: The Trees / Fog','Hindi: Kritika: Mata ka Anchal','IT: IT practical: Writer + Calc','SST: Economics: Development','Maths: Introduction to Trigonometry (revision)','Science: Life Processes (revision)','T:IT',
'SST: Economics: Sectors of Indian Economy','Maths: Applications of Trigonometry (revision)','English: Poems: The Tale of Custard the Dragon / For Anne Gregory'];
let S=null;
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dOf=i=>new Date(2026,10,1+i);
const toM=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const f12=s=>{let[h,m]=s.split(':');h=+h;return(h%12||12)+':'+m+(h>=12?' PM':' AM')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowIdx=()=>{const n=new Date();return Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-ST)/864e5)};
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
function recall(i){if(i===1)return'Baseline: Maths formulas + Science recall';
 for(let j=i-1;j>=0;j--)if(!P[j].startsWith('T:'))return P[j];return''}
function tasks(i){const c=P[i];
 if(c.startsWith('T:'))return[
 {id:1,s:'18:30',e:'19:30',t:'Weekly test, 25 marks: '+c.slice(2),n:'60 min · 5×1, 4×2, 3×4 marks'},
 {id:2,s:'19:30',e:'20:00',t:'Correction: score + error log',n:'30 min'},
 {id:3,s:'20:00',e:'20:45',t:'School homework',n:'45 min'},
 {id:4,s:'20:45',e:'21:00',t:'Backlog: missed PYQs',n:'15 min'}];
 return[
 {id:1,s:'18:30',e:'19:00',t:'Recall: '+recall(i),n:'30 min',ch:i===1?null:recall(i)},
 {id:2,s:'19:00',e:'19:45',t:'Homework: school + tuition',n:'45 min'},
 {id:3,s:'19:45',e:'20:30',t:'Study: '+c,n:'20 min learn · 15 min NCERT · 10 min quiz',ch:c},
 {id:4,s:'20:30',e:'21:00',t:'Daily test (15 marks): '+c,n:'30 min · 3 MCQ + written, mark yourself',dt:DM[ds(dOf(i))]}]}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||!S.log)S={log:{}};S.tests=S.tests||{};S.dts=S.dts||{}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function settle(){const ni=nowIdx(),nm=nowM();
 for(let i=0;i<=Math.min(ni,N-1);i++){const k=ds(dOf(i));S.log[k]=S.log[k]||{};
  tasks(i).forEach(t=>{if(S.log[k][t.id])return;if(t.id===1&&S.cur&&!S.cur.late&&S.cur.n===i/7+1)return;if(t.dt&&S.dcur&&!S.dcur.late&&S.dcur.n===t.dt)return;if(i<ni||toM(t.e)<nm)S.log[k][t.id]='miss'})}
 save()}
function dayStatus(i){const l=S.log[ds(dOf(i))]||{},v=tasks(i).map(t=>l[t.id]);
 if(v.includes('miss'))return'x';if(v.includes('weak'))return'y';if(v.every(x=>x==='done'))return'ok';return i===nowIdx()?'part':'x'}
function totals(){let score=0,done=0,miss=0;
 Object.keys(S.log).sort().forEach(k=>Object.values(S.log[k]).forEach(v=>{if(v==='done'){done++;score++}else if(v==='miss'){miss++;score=Math.max(0,score-1)}}));
 return{score,done,miss}}
function runs(){let cur=0,best=0;
 for(let i=0;i<=Math.min(nowIdx(),N-1);i++){const s=dayStatus(i);
  if(s==='ok'){cur++;best=Math.max(best,cur)}else if(s==='x')cur=0}
 return{cur,best}}
function badges(t,r){const TR=Object.values(S.tests||{});return[
['🌱','First tick','Finish 1 task on time',t.done>=1],
['✏️','25 on time','25 ticks before deadline',t.done>=25],
['📚','100 on time','100 ticks before deadline',t.done>=100],
['🏅','250 on time','250 ticks before deadline',t.done>=250],
['🔥','3-day streak','3 perfect days in a row',r.best>=3],
['⚡','7-day streak','7 perfect days in a row',r.best>=7],
['💎','21-day streak','21 perfect days in a row',r.best>=21],
['👑','50-day streak','50 perfect days in a row',r.best>=50],
['🎯','Halfway','Reach half the points goal',t.score>=GOAL/2],
['🏆','95% club','Reach the full points goal',t.score>=GOAL],
['📝','First test','Submit your first weekly test',TR.length>=1],['⭐','Strong 21+','Score 21 or more in a test',TR.some(x=>x.score>=21)],['💯','Perfect 25','Score 25/25 in a test',TR.some(x=>x.score>=25)],['🎓','All 12 tests','Submit all 12 weekly tests',TR.length>=12],['📓','10 daily tests','Submit 10 daily tests',Object.keys(S.dts||{}).length>=10]]}
function tick(id){settle();const i=nowIdx();if(i<0||i>=N)return;
 const k=ds(dOf(i)),t=tasks(i).find(x=>x.id==id),l=S.log[k];
 if(l[id]==='miss'||nowM()>toM(t.e))return;
 if(l[id]==='done')delete l[id];else l[id]='done';save();render()}
function left(e){const m=toM(e)-nowM();return m<60?m+' min left':Math.floor(m/60)+'h '+pad(m%60)+'m left'}
function home(){const ni=nowIdx(),i=Math.max(0,Math.min(N-1,ni)),live=ni>=0&&ni<N;
 const l=S.log[ds(dOf(i))]||{},t=totals(),r=runs();
 const dn=Object.values(l).filter(x=>x==='done').length;
 const banner=ni<0?'Your plan starts on Sun 1 Nov. This is Day 1 as a preview.':ni>=N?'The 81-day plan is finished. This is the last day.':'';
 const list=tasks(i).map(x=>{const st=live?(l[x.id]||''):'';
  const sub=st==='done'?'Done on time ✅':st==='miss'?'❌ Missed, deadline '+f12(x.e):st==='weak'?'🟡 Ticked, under 80%. Open it to solve again.':live?(x.id===1&&P[i].startsWith('T:')&&nowM()<toM(x.s)?'Opens at '+f12(x.s):'Finish by '+f12(x.e)+' · '+left(x.e)):'Finish by '+f12(x.e);
  return`<div class="task ${st}">${boxHtml(x,i,st,live)}<div class="t"><div class="time">${f12(x.s)} – ${f12(x.e)}</div>${esc(x.t)}<div class="s">${esc(x.n)} · ${sub}</div></div></div>`}).join('');
 const dt=dOf(i).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
 return`<header><a class="btn" href="#streak">🔥 ${r.cur}</a><div><h1>Today’s plan</h1><div class="date">${dt} · Day ${i+1} of ${N}</div></div></header>
 ${banner?`<div class="banner">${banner}</div>`:''}
 <div class="stats"><div class="stat"><b>${dn}/4</b><span>done today</span></div><div class="stat"><b>${t.score}</b><span>streak points</span></div><div class="stat"><b>${r.cur}</b><span>day streak</span></div></div>
 ${weakBox()}${list}
function streak(){const t=totals(),r=runs(),ni=nowIdx(),pct=Math.min(95,t.score/GOAL*95);
 const cells=['S','M','T','W','T','F','S'].map(x=>`<div class="wd">${x}</div>`);
 for(let i=0;i<N;i++){const s=i<=ni?dayStatus(i):'';cells.push(`<div class="d ${s} ${i===ni?'today':''}" title="Day ${i+1}">${dOf(i).getDate()}</div>`)}
 const b=badges(t,r),got=b.filter(x=>x[3]).length;
 const rows=P.map((c,i)=>`<div><b>${dOf(i).toLocaleDateString('en-IN',{day:'2-digit',month:'short',weekday:'short'})}</b><span>${c.startsWith('T:')?'Weekly test: '+esc(c.slice(2)):esc(c)}</span></div>`).join('');
 return`<header><a class="btn" href="#home">← Home</a><div><h1>Streak</h1><div class="date">Day ${Math.max(0,Math.min(N,ni+1))} of ${N}</div></div></header>
 <div class="card"><div class="big">🔥 ${r.cur}</div><div class="date">day streak · best ${r.best} · ${t.done} on time · ${t.miss} missed</div></div>
 <h2>Path to 95% in boards</h2><div class="card"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="95" aria-valuenow="${pct.toFixed(1)}"><i style="width:${pct/95*100}%"></i></div>
 <b>${pct.toFixed(1)}%</b> of the 95% target<div class="note">Each on-time tick adds 1 point and each missed task removes 1. ${t.score} of ${GOAL} points. The plan has ${N*4} tasks.</div></div>
 <h2>Streak map · 1 Nov to 20 Jan</h2><div class="card"><div class="map">${cells.join('')}</div>
 <div class="note" style="margin-top:10px">Green = all 4 tasks on time · Yellow = ticked but under 80%, solve again · Red = a missed task · Dashed = today</div></div>
 ${testList()}${dailyList()}<h2>Badges · ${got}/${b.length}</h2><div class="badges">${b.map(x=>`<div class="bd ${x[3]?'':'lock'}"><b>${x[0]} ${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>
 <h2>Plan</h2><details class="card"><summary>Chapter for every day</summary><div class="chart">${rows}</div></details>`
const DM={};(window.DT||[]).forEach(d=>DM[d.date]=d.n);
const dIdx=n=>Math.round((new Date(DT[n-1].date+'T00:00')-ST)/864e5);
function openDaily(n){const i=dIdx(n),ni=nowIdx();
 if(S.dts[n]){location.hash='#dresult-'+n;return}
 if(S.dcur){location.hash='#daily';return}
 if(ni<i||(ni===i&&nowM()<toM('20:30')))return;
 const live=ni===i&&nowM()<=toM('21:00');
 S.dcur={n,start:Date.now(),a:[],i:0,late:!live};save();location.hash='#daily'}
function dSubmit(){const c=S.dcur;if(!c)return;const D=DT[c.n-1];let m=0;
 D.mcq.forEach((q,j)=>{if(c.a[j]===q.a)m++});
 S.dts[c.n]={m,a:D.mcq.map((_,j)=>c.a[j]==null?null:c.a[j]),w:[null,null,null,null],secs:Math.min(1800,Math.round((Date.now()-c.start)/1000)),late:c.late};
 if(!c.late){S.log[D.date]=S.log[D.date]||{};S.log[D.date][4]='done'}
 S.dcur=null;save();clearInterval(tm);location.hash='#dresult-'+c.n;render()}
function dPick(j){S.dcur.a[S.dcur.i]=j;save();render()}
function dGo(d){S.dcur.i+=d;save();render()}
function dailyView(){const c=S.dcur;if(!c){location.hash='#home';return''}
 const D=DT[c.n-1],j=c.i;clearInterval(tm);
 tm=setInterval(()=>{const e=document.getElementById('tmr');if(!e){clearInterval(tm);return}const l=c.start+1800000-Date.now();if(l<=0){clearInterval(tm);dSubmit();return}e.textContent=mmss(l)},1000);
 const head=`<header><a class="btn" href="#home">← Exit</a><div><h1>Daily test ${c.n}</h1><div class="date">${esc(D.sub)}: ${esc(D.ch)}<br>${c.late?'Late attempt, no streak point · ':''}Time left <b id="tmr">${mmss(Math.max(0,c.start+1800000-Date.now()))}</b></div></div></header>`;
 if(j<3){const q=D.mcq[j];
  return head+`<div class="card"><div class="note">Section A · Question ${j+1} of 3 · 1 mark</div><div class="q">${esc(q.q)}</div>${q.o.map((o,m)=>`<button class="opt ${c.a[j]===m?'sel':''}" onclick="dPick(${m})"><b>${'ABCD'[m]}</b> ${esc(o)}</button>`).join('')}</div>
  <div class="row"><button class="btn" onclick="dGo(-1)" ${j?'':'disabled'}>← Prev</button><button class="btn" onclick="dGo(1)">${j<2?'Next →':'Written part →'}</button></div>`}
 return head+`<div class="card"><div class="note">Section B and C: write these answers in your notebook</div>${D.sb.map((q,k)=>`<div class="q">${k+4}. ${esc(q)} <span class="note">(2 marks)</span></div>`).join('')}<div class="q">7. ${esc(D.sc)} <span class="note">(6 marks)</span></div></div>
 <div class="row"><button class="btn" onclick="dGo(-1)">← Back to MCQs</button></div>
 <div class="card"><div class="note">Answers stay hidden until you submit. You mark your written answers yourself on the result page.</div><div class="row"><button class="btn" onclick="dSubmit()">Submit test</button></div></div>`}
function dResult(n){const r=S.dts[n],D=DT[n-1];
 if(!r)return'<header><a class="btn" href="#streak">← Streak</a></header><div class="card">No result yet.</div>';
 const W=[[D.sb[0],2,D.g.g45],[D.sb[1],2,D.g.g45],[D.sb[2],2,D.g.g6],[D.sc,6,D.g.g7]],tot=r.m+r.w.reduce((a,b)=>a+(b||0),0);
 return`<header><a class="btn" href="#streak">← Streak</a><div><h1>Daily test ${n} result</h1><div class="date">${esc(D.sub)}: ${esc(D.ch)}</div></div></header>
 <div class="card"><div class="big">${tot}/15</div><div class="date">MCQ ${r.m}/3 · Written ${tot-r.m}/12 (marked by you)${r.late?' · late attempt, no streak point':' · counted for your streak ✅'}</div></div>
 <h2>Section A</h2>${D.mcq.map((q,j)=>`<div class="card" style="margin-bottom:8px"><div class="q">${esc(q.q)}</div><div class="s" style="color:${r.a[j]===q.a?'var(--ok)':'var(--no)'}">Your answer: ${r.a[j]==null?'Not answered':'ABCD'[r.a[j]]+') '+esc(q.o[r.a[j]])}</div>${r.a[j]===q.a?'':`<div class="s" style="color:var(--ok)">Correct: ${'ABCD'[q.a]}) ${esc(q.o[q.a])}</div>`}</div>`).join('')}
 <h2>Section B and C: mark yourself</h2>${W.map(([q,mx,g],k)=>`<div class="card" style="margin-bottom:8px"><div class="note">Q${k+4} · ${mx} marks</div><div class="q">${esc(q)}</div><div class="s">Marking guide: ${esc(g)}</div><div class="row"><button class="btn" onclick="dMark(${n},${k},-1)">−</button><b style="align-self:center">${r.w[k]==null?'–':r.w[k]}/${mx}</b><button class="btn" onclick="dMark(${n},${k},1)">+</button></div></div>`).join('')}`}
function dMark(n,k,d){const r=S.dts[n],mx=k<3?2:6;r.w[k]=Math.max(0,Math.min(mx,(r.w[k]||0)+d));save();render()}
function dailyList(){const ni=nowIdx(),R=Object.values(S.dts),avg=R.length?(R.reduce((a,r)=>a+r.m+r.w.reduce((x,y)=>x+(y||0),0),0)/R.length).toFixed(1):'–';
 return`<h2>Daily tests · ${R.length}/${DT.length} done · average ${avg}/15</h2><details class="card"><summary>All 69 daily tests</summary>`+DT.map(D=>{const i=dIdx(D.n),r=S.dts[D.n],lock=ni<i||(ni===i&&nowM()<toM('20:30')),ip=S.dcur&&S.dcur.n===D.n;
  const st=r?`<b>${r.m+r.w.reduce((a,b)=>a+(b||0),0)}/15</b>${r.late?' (late)':''}`:ip?'In progress':lock?'🔒 Opens '+dOf(i).toLocaleDateString('en-IN',{day:'numeric',month:'short'})+', 8:30 PM':ni===i?'📝 Open now':'Missed · tap to take it late';
  return`<div class="trow"><button class="btn" ${lock&&!r?'disabled':''} onclick="openDaily(${D.n})">${r?'Result':ip?'Continue':lock?'🔒':'Open'}</button><div><b>${D.n}. ${esc(D.sub)}: ${esc(D.ch)}</b><div class="s">${st}</div></div></div>`}).join('')+'</details>'}

function weakBox(){const w=[];Object.keys(S.log).sort().forEach(k=>{const i=Math.round((new Date(k+'T00:00')-ST)/864e5);
  Object.entries(S.log[k]).forEach(([tid,v])=>{if(v==='weak'){const id=chId((tasks(i).find(x=>x.id==tid)||{}).ch);if(id)w.push({i,tid,id})}})});
 return w.length?`<div class="banner"><b>Solve again to earn your streak points</b><div class="row" style="flex-wrap:wrap">${w.map(x=>`<button class="btn" onclick="openLesson(${x.i},${x.tid})">🟡 ${esc(CH[x.id].n)} · Day ${x.i+1}</button>`).join('')}</div></div>`:''}
function openLesson(i,tid){const k=ds(dOf(i)),st=(S.log[k]||{})[tid],t=tasks(i).find(x=>x.id==tid);
 const score=(nowIdx()===i&&!st&&nowM()<=toM(t.e))||st==='weak';
 S.les={i,tid,id:chId(t.ch),ans:[],idx:0,score,big:true,r:null,applied:false};save();location.hash='#lesson'}
function lessonShell(a){const L=S.les;if(!L){location.hash='#home';return}
 const key=L.id+'|'+L.i+'|'+L.tid;
 if(a.dataset.les!==key||!document.getElementById('lq')){a.dataset.les=key;
  const c=CH[L.id],t=tasks(L.i).find(x=>x.id==L.tid);
  const vid=c.v?`<div class="vwrap ${L.big?'':'small'}" id="vw"><iframe src="https://www.youtube.com/embed/${c.v}?playsinline=1&rel=0" title="${esc(c.t||c.n)}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
  <div class="row" style="flex-wrap:wrap"><button class="btn" id="vs" onclick="vsize()">${L.big?'Small video':'Big video'}</button><button class="btn" onclick="vfull()">⛶ Full screen</button><a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${c.v}">Open in YouTube</a></div>`
  :`<div class="card" style="margin-bottom:10px">Video link is not available. Study this chapter yourself, then solve the questions below.</div>`;
  a.innerHTML=`<header><a class="btn" href="#home">← Home</a><div><h1>${esc(c.n)}</h1><div class="date">${esc(t.t.split(':')[0])} · ${f12(t.s)} – ${f12(t.e)}</div></div></header>${vid}<div id="lq"></div>`}
 renderQ()}
function vsize(){const L=S.les,w=document.getElementById('vw');L.big=!L.big;w.classList.toggle('small',!L.big);document.getElementById('vs').textContent=L.big?'Small video':'Big video';save()}
function vfull(){const f=document.querySelector('#vw iframe');try{(f.requestFullscreen||f.webkitRequestFullscreen).call(f)}catch(e){}}
function renderQ(){const L=S.les,q=document.getElementById('lq');if(!q)return;
 const Q=window.QA&&QA[L.id]?QA[L.id].q:null;
 if(!Q){q.innerHTML=`<div class="card">Questions for this chapter are coming soon.</div>${L.score?'<div class="row"><button class="btn" onclick="lMark()">Mark as done</button></div>':''}`;return}
 const n=Q.length,need=Math.ceil(n*0.8);
 if(L.r!=null){q.innerHTML=`<div class="card"><div class="big">${L.r}/${n}</div><div class="date">${L.score?(L.r>=need?'Passed: counted for your streak ✅':'Under 80%: ticked as checklist only, no streak point. The day shows yellow. Solve again.'):'Practice only: this does not change your streak.'}</div></div><div class="row"><button class="btn" onclick="lRetry()">Solve again</button><a class="btn" href="#home">Back to Home</a></div>`;return}
 const j=L.idx,k0=Q[j],a=L.ans[j];
 q.innerHTML=`<div class="card"><div class="note">Question ${j+1} of ${n} · ${L.score?'Need '+need+' right to count':'Practice only'}</div><div class="q">${esc(k0.q)}</div>${k0.o.map((o,m)=>`<button class="opt ${a==null?'':m===k0.a?'ok':m===a?'bad':''}" ${a==null?'':'disabled'} onclick="lAns(${m})"><b>${'ABCD'[m]}</b> ${esc(o)}</button>`).join('')}${a==null?'':`<div class="note" style="margin-top:8px">${a===k0.a?'Correct. ':'Not correct. '}${esc(k0.e)}</div><div class="row"><button class="btn" onclick="lNext()">${j<n-1?'Next →':'See result'}</button></div>`}</div>`}
function lAns(m){const L=S.les;if(L.ans[L.idx]!=null)return;L.ans[L.idx]=m;save();renderQ()}
function lNext(){const L=S.les,Q=QA[L.id].q;if(L.idx<Q.length-1){L.idx++}else{
  L.r=Q.filter((q,j)=>L.ans[j]===q.a).length;
  if(L.score&&!L.applied){const k=ds(dOf(L.i));S.log[k]=S.log[k]||{};S.log[k][L.tid]=L.r>=Math.ceil(Q.length*0.8)?'done':'weak';L.applied=true}}
 save();renderQ()}
function lRetry(){const L=S.les,st=(S.log[ds(dOf(L.i))]||{})[L.tid];S.les={...L,ans:[],idx:0,r:null,applied:false,score:st==='weak'};save();renderQ()}
function lMark(){const L=S.les,k=ds(dOf(L.i));S.log[k]=S.log[k]||{};S.log[k][L.tid]='done';save();location.hash='#home'}

const mmss=ms=>{const m=Math.floor(ms/60000),c=Math.floor(ms%60000/1000);return pad(m)+':'+pad(c)};
function chId(ch){return ch?PM[ch.replace(/ \(revision\)$/,'')]||null:null}
function boxHtml(x,i,st,live){
 if(x.dt){const n=x.dt,r=S.dts[n],wait=!live||(nowM()<toM(x.s)&&!S.dcur);return`<button class="box" data-daily="${n}" ${(live&&!wait)||r||(!live&&i<nowIdx())?'':'disabled'} aria-label="Open daily test ${n}">${r&&!r.late?'✓':st==='miss'?'❌':wait&&!r&&live?'🔒':r?'✓':'📝'}</button>`}
 if(x.ch&&chId(x.ch))return`<button class="box" data-lesson="${x.id}" data-day="${i}" aria-label="Open lesson: ${esc(x.t)}">${st==='done'||st==='weak'?'✓':st==='miss'?'❌':'▶'}</button>`;
 if(x.id===1&&P[i].startsWith('T:')){const n=i/7+1,r=S.tests[n],wait=live&&!r&&nowM()<toM(x.s)&&!(S.cur&&S.cur.n===n);
  return`<button class="box" data-open="${n}" ${(live&&!wait)||r?'':'disabled'} aria-label="Open test ${n}">${r?'✓':st==='miss'?'❌':wait?'🔒':'📝'}</button>`}
 return`<button class="box" data-id="${x.id}" ${live?'':'disabled'} aria-label="${esc(x.t)}">${st==='done'?'✓':st==='miss'?'❌':''}</button>`}
function openTest(n){const i=(n-1)*7,ni=nowIdx();
 if(S.tests[n]){location.hash='#results-'+n;return}
 if(S.cur){location.hash='#test';return}
 if(ni<i||(ni===i&&nowM()<toM('18:30')))return;
 const live=ni===i&&nowM()<=toM('19:30');
 S.cur={n,start:Date.now(),ans:[],i:0,late:!live};save();location.hash='#test'}
function submit(){const c=S.cur;if(!c)return;const T=TESTS[c.n-1];let sc=0;
 T.q.forEach((q,j)=>{if(c.ans[j]===q.a)sc++});
 S.tests[c.n]={score:sc,ans:T.q.map((_,j)=>c.ans[j]==null?null:c.ans[j]),secs:Math.min(3600,Math.round((Date.now()-c.start)/1000)),late:c.late,at:Date.now()};
 if(!c.late){const k=ds(dOf((c.n-1)*7));S.log[k]=S.log[k]||{};S.log[k][1]='done'}
 S.cur=null;save();clearInterval(tm);location.hash='#results-'+c.n;render()}
function pick(j){S.cur.ans[S.cur.i]=j;save();render()}
function go(d){S.cur.i+=d;save();render()}
function jump(j){S.cur.i=j;save();render()}
let tm=null;
function testView(){const c=S.cur;if(!c){location.hash='#streak';return''}
 const T=TESTS[c.n-1],q=T.q[c.i],last=c.i===T.q.length-1,un=T.q.filter((_,j)=>c.ans[j]==null).length;
 clearInterval(tm);tm=setInterval(()=>{const e=document.getElementById('tmr');if(!e){clearInterval(tm);return}const l=c.start+3600000-Date.now();if(l<=0){clearInterval(tm);submit();return}e.textContent=mmss(l)},1000);
 return`<header><a class="btn" href="#home">← Exit</a><div><h1>Test ${c.n} · ${esc(T.sub)}</h1><div class="date">${c.late?'Late attempt, no streak points · ':''}Time left <b id="tmr">${mmss(Math.max(0,c.start+3600000-Date.now()))}</b></div></div></header>
 <div class="card"><div class="note">Question ${c.i+1} of ${T.q.length}</div><div class="q">${esc(q.t)}</div>
 ${q.o.map((o,j)=>`<button class="opt ${c.ans[c.i]===j?'sel':''}" onclick="pick(${j})"><b>${'ABCD'[j]}</b> ${esc(o)}</button>`).join('')}</div>
 <div class="row"><button class="btn" onclick="go(-1)" ${c.i?'':'disabled'}>← Prev</button><button class="btn" onclick="go(1)" ${last?'disabled':''}>Next →</button></div>
 <div class="pal">${T.q.map((_,j)=>`<button class="pn ${c.ans[j]!=null?'a':''} ${j===c.i?'c':''}" onclick="jump(${j})">${j+1}</button>`).join('')}</div>
 ${last?`<div class="card" style="margin-top:12px"><div class="note">${un?un+' unanswered. ':'All answered. '}Answers cannot be changed after you submit.</div><div class="row"><button class="btn" onclick="submit()">Submit test</button></div></div>`:''}`}
function resultView(n){const r=S.tests[n],T=TESTS[n-1];
 if(!r)return'<header><a class="btn" href="#streak">← Streak</a></header><div class="card">No result yet.</div>';
 const lab=r.score<15?'Weak: relearn within 3 days':r.score<21?'Developing: do extra PYQs':'Strong: revise again after 7 days';
 const w=T.q.map((q,j)=>({q,j,a:r.ans[j]})).filter(x=>x.a!==x.q.a),sk=w.filter(x=>x.a==null).length;
 return`<header><a class="btn" href="#streak">← Streak</a><div><h1>Test ${n} result</h1><div class="date">${esc(T.sub)} · ${T.date}${r.late?' · late attempt':''}</div></div></header>
 <div class="card"><div class="big">${r.score}/25</div><div class="date">${lab}</div><div class="note">${25-w.length} correct · ${w.length-sk} wrong · ${sk} skipped · ${Math.max(1,Math.round(r.secs/60))} min</div></div>
 <h2>Mistakes (${w.length})</h2>${w.map(x=>`<div class="card" style="margin-bottom:8px"><div class="note">Q${x.j+1}</div><div class="q">${esc(x.q.t)}</div><div class="s" style="color:var(--no)">Your answer: ${x.a==null?'Not answered':'ABCD'[x.a]+') '+esc(x.q.o[x.a])}</div><div class="s" style="color:var(--ok)">Correct: ${'ABCD'[x.q.a]}) ${esc(x.q.o[x.q.a])}</div></div>`).join('')||'<div class="card">No mistakes. Perfect score!</div>'}
 <div class="note">Write each mistake with the correct concept. Retest these after 3 days and again after 1 week.</div>`}
function testList(){const ni=nowIdx(),R=Object.values(S.tests),avg=R.length?(R.reduce((a,b)=>a+b.score,0)/R.length).toFixed(1):'–';
 return`<h2>Weekly tests · average ${avg}/25</h2><div class="card">`+TESTS.map(T=>{const i=(T.n-1)*7,r=S.tests[T.n],lock=ni<i||(ni===i&&nowM()<toM('18:30')),ip=S.cur&&S.cur.n===T.n;
  const st=r?`<b>${r.score}/25</b>${r.late?' (late attempt)':''}`:ip?'In progress':lock?'🔒 Opens '+dOf(i).toLocaleDateString('en-IN',{day:'numeric',month:'short'})+', 6:30 PM':ni===i?'📝 Open now':'Missed · tap to take it late';
  return`<div class="trow"><button class="btn" ${lock&&!r?'disabled':''} onclick="openTest(${T.n})">${r?'Result':ip?'Continue':lock?'🔒':'Open'}</button><div><b>Test ${T.n} · ${esc(T.sub)}</b><div class="s">${st}</div></div></div>`}).join('')+'</div>'}

function render(){if(S.cur&&Date.now()>=S.cur.start+3600000){submit();return}if(S.dcur&&Date.now()>=S.dcur.start+1800000){dSubmit();return}settle();const a=document.getElementById('app'),h=location.hash;
 if(h==='#lesson'){lessonShell(a);return}a.dataset.les='';
 a.innerHTML=h==='#streak'?streak():h==='#test'?testView():h==='#daily'?dailyView():h.startsWith('#dresult-')?dResult(+h.slice(9)):h.startsWith('#results-')?resultView(+h.slice(9)):home();
 a.querySelectorAll('.box').forEach(b=>b.onclick=()=>b.dataset.daily?openDaily(+b.dataset.daily):b.dataset.lesson?openLesson(+b.dataset.day,+b.dataset.lesson):b.dataset.open?openTest(+b.dataset.open):tick(b.dataset.id));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
load();render();setInterval(()=>{if(location.hash!=='#test'&&location.hash!=='#lesson'&&location.hash!=='#daily'&&!(document.activeElement&&document.activeElement.tagName==='TEXTAREA'))render()},30000);
</script>
</body>
</html>
